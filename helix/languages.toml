[[language]]
name = "python"
language-servers = ["ruff", "ty"]
auto-format = true
formatter = { command = "ruff", args = ["format", "-"] }

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ty]
command = "ty"
args = ["server"]

[[language]]
name = "rust"
auto-format = true

[language-server.rust-analyzer.config]
# Optional: Enable clippy for better linting on save
checkOnSave = { command = "clippy" }
# Optional: Enable all cargo features for better analysis
cargo = { allFeatures = true }

[[language]]
name = "typst"
language-servers = ["tinymist"]

[language-server.tinymist]
command = "tinymist"
config.preview.background.enabled = true
config.preview.background.args = [
  "--data-plane-host=127.0.0.1:23635",
  "--invert-colors=never",
  "--open"
]
